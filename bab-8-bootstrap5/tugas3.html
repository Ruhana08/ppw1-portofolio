<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Nilai</title>

  <!-- DaisyUI + Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-base-200 p-6">

  <!-- HEADER / PROFILE -->
  <div class="card bg-base-100 shadow mb-6">
    <div class="card-body flex flex-row items-center gap-4">
      
      <!-- FOTO PROFIL -->
      <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" 
      class="w-16 h-16 rounded-full object-cover">

      <div>
        <h2 class="text-xl font-bold">Nama Mahasiswa</h2>
        <span class="badge badge-success">Mahasiswa Aktif</span>
      </div>

    </div>
  </div>

  <!-- STATISTIK -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h3 class="text-lg">📚 Total SKS</h3>
        <p class="text-2xl font-bold">110</p>
      </div>
    </div>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h3 class="text-lg">⭐ IPK</h3>
        <p class="text-2xl font-bold">3.75</p>
      </div>
    </div>

    <div class="card bg-base-100 shadow">
      <div class="card-body">
        <h3 class="text-lg">✅ Mata Kuliah Lulus</h3>
        <p class="text-2xl font-bold">36</p>
      </div>
    </div>

  </div>

  <!-- TABEL NILAI -->
  <div class="card bg-base-100 shadow">
    <div class="card-body">
      <h3 class="text-lg font-bold mb-4">Daftar Nilai</h3>

      <div class="overflow-x-auto">
        <table class="table">
          <thead>
            <tr>
              <th>No</th>
              <th>Mata Kuliah</th>
              <th>SKS</th>
              <th>Nilai Huruf</th>
              <th>Nilai Angka</th>
              <th>Aksi</th>
            </tr>
          </thead>

          <tbody>

            <tr>
              <td>1</td>
              <td>Pemrograman Web</td>
              <td>3</td>
              <td><span class="badge badge-success">A</span></td>
              <td>4.0</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="openModal('Pemrograman Web', 'Belajar HTML, CSS, dan JavaScript')">
                  Detail
                </button>
              </td>
            </tr>

            <tr>
              <td>2</td>
              <td>Basis Data</td>
              <td>3</td>
              <td><span class="badge badge-info">B</span></td>
              <td>3.0</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="openModal('Basis Data', 'Belajar SQL dan manajemen database')">
                  Detail
                </button>
              </td>
            </tr>

            <tr>
              <td>3</td>
              <td>Algoritma</td>
              <td>2</td>
              <td><span class="badge badge-warning">C</span></td>
              <td>2.0</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="openModal('Algoritma', 'Dasar logika pemrograman')">
                  Detail
                </button>
              </td>
            </tr>

            <tr>
              <td>4</td>
              <td>Jaringan Komputer</td>
              <td>2</td>
              <td><span class="badge badge-error">D</span></td>
              <td>1.0</td>
              <td>
                <button class="btn btn-sm btn-primary" onclick="openModal('Jaringan Komputer', 'Konsep jaringan dan internet')">
                  Detail
                </button>
              </td>
            </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- MODAL -->
  <dialog id="modalDetail" class="modal">
    <div class="modal-box">
      <h3 id="modalTitle" class="font-bold text-lg"></h3>
      <p id="modalDesc" class="py-2"></p>

      <div class="modal-action">
        <button class="btn" onclick="closeModal()">Tutup</button>
      </div>
    </div>
  </dialog>

  <!-- SCRIPT -->
  <script>
    const modal = document.getElementById("modalDetail");
    const title = document.getElementById("modalTitle");
    const desc = document.getElementById("modalDesc");

    function openModal(matkul, deskripsi) {
      title.innerText = matkul;
      desc.innerText = deskripsi;
      modal.showModal();
    }

    function closeModal() {
      modal.close();
    }
  </script>

</body>
</html>
