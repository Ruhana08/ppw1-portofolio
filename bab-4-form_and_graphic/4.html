<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
</head>
<body>
    <table align="center">
        <tr>
            <td><small>
                <form align="center"  align="middle" action="5.html" method="get">
                    <fieldset align="center" width="60%">
                        <table align="center" cellpadding="5" cellspacing="2" size="30">
                            <br>
                            <tr>
                                <td colspan="3"><legend align="center"><h1>Form Pendaftaran Marathon</h1></legend></td>
                            </tr>
                            <tr>
                                <td align="left" size="30">Nama Lengkap</td>
                                <td>:</td>
                                <td align="left"><input type="text" size="25" name="username" required></td>
                            </tr>
                            <tr>
                                <td align="left" size="30"><label>Jenis Kelamin</label></td>
                                <td>:</td>
                                    <td align="left" size="30" required>
                                        <input type="radio" name="jk" value="Laki-laki">Laki-laki
                                        <input type="radio" name="jk" value="Perempuan">Perempuan
                                    </td>
                            </tr>
                            <tr>
                                <td align="left" size="30">No. Hp</td>
                                <td>:</td>
                                <td align="left"><input type="tel" size="25" required></td>
                            </tr>
                            <tr>
                                <td align="left" size="30">Email</td>
                                <td>:</td>
                                <td align="left"><input type="email" size="25" required></td>
                            </tr>
                            <tr>
                                <td align="left">Kategori Lomba</td>
                                <td>:</td>
                                <td align="left" required>
                                    <input type="radio" name="lomba"> 5K
                                    <input type="radio" name="lomba"> 10K
                                    <input type="radio" name="lomba"> 21K
                                </td>
                            </tr>
                            <tr>
                                <td align="left">Upload bukti pembayaran:</td>
                                <td>:</td>
                                <td align="right"><input type="file" required></td>
                            </tr>
                            <tr>
                                <td></td>
                            </tr>
                            <tr>
                                <td colspan="3" align="center">
                                    <table>
                                        <tr>
                                            <td ><input type="submit" value="Daftar Sekarang" size="40" ></td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </fieldset>
                </form>
            </td></small>
        </tr>
    </table>
    </center>
</body>
</html>
