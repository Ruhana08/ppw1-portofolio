<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List bersarang dan list definisi</title>
</head>
<body>
    <h4>Sebuah list bersarang</h4>
    <ul>
        <li>Kopi</li>
        <li>Teh
            <ul>
                <li>Teh hitam</li>
                <li>Teh hijau</li>
            </ul>
        </li>
        <li>Susu
            <ul>
                <li>Susu Putih</li>
                <li>Susu Cokelat</li>
                <li>Susu stroberi</li>
            </ul>
        </li>
    </ul>
    <br>
    <h4>Contoh list definisi</h4>
    <dl>
        <dt>Kopi adalah:</dt>
        <dd>Minuman panas hitam</dd>
        <br>
        <dt>Susu adalah:</dt>
        <dd>Minuman dingin putih</dd>
    </dl>
</body>
</html>
