<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garis Horizontal dan Komentar Tersembunyi</title>
</head>
<body>
    <hr color="blue">
    <p align="left">terdapat paragraf disini</p>
    <hr width="80%" size="10" align="left">
    <p align="right">terdapat paragraf disini</p>
    <hr width="400" size="6" align="right" color="pink">
    <center>
        <p>Terdapat paragraf disini</p>
    </center>
    <!- ini adalah komentar yang tidak akan ditampilkan di web browser>
</body>
</html>
