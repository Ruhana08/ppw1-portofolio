<!DOCTYPE html>
<html>
<head>
    <title>Tugas PPW1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div id="konten"></div>

    <script>
        // Langkah 1 & 2
        let tanya = confirm("Apakah anda praktikan PPW1?");

        if (tanya) {
            // Langkah 3
            let nama = prompt("Nama:");
            let nim = prompt("NIM:");
            let angkatan = prompt("Angkatan:");

            // Langkah 5
            document.getElementById("konten").innerHTML = `
                <div class="card p-3 shadow">
                    <h4 class="mb-3">Data Praktikan</h4>
                    <table class="table table-striped table-hover">
                        <thead class="table-primary">
                            <tr>
                                <th>Nama</th>
                                <th>NIM</th>
                                <th>Angkatan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${nama}</td>
                                <td>${nim}</td>
                                <td>${angkatan}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>`;
        } else {
            // Jika Klik Cancel
            document.getElementById("konten").innerHTML = `
                <div class="alert alert-danger text-center">
                    <strong>STOP!</strong> Anda bukan praktikan PPW1, anda tidak boleh masuk!
                </div>`;
        }
    </script>
</body>
</html>
