<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tugas 1 — CSS Position & DaisyUI</title>
  
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .font-syne { font-family: 'Syne', sans-serif; }
  </style>
</head>
<body class="bg-base-300 min-h-[120vh]">

  <div class="navbar bg-base-100/80 backdrop-blur sticky top-0 z-50 border-b 
  border-white/5 px-4 md:px-20">
    <div class="flex-1">
      <a class="btn btn-ghost text-xl font-syne font-extrabold bg-gradient-to-r from-[#a78bfa] to-[#f472b6] bg-clip-text text-transparent">
        CSSPosition.
      </a>
    </div>
    <div class="flex-none">
      <ul class="menu menu-horizontal px-1 font-medium text-sm">
        <li><a>Beranda</a></li>
        <li><a>Profil</a></li>
        <li><a>Kontak</a></li>
      </ul>
    </div>
  </div>

  <main class="flex flex-col items-center py-16 px-4 gap-8">
    
    <div class="text-center mb-2">
      <span class="text-xs font-bold tracking-[0.3em] text-primary uppercase opacity-80">Tugas 1</span>
      <h1 class="text-3xl font-syne font-black mt-2">Kartu Profil</h1>
    </div>

    <div class="card w-[280px] h-[350px] bg-base-100 shadow-2xl relative overflow-hidden 
    border border-white/10 p-6">
      
      <div class="absolute top-4 right-4 z-10 flex items-center gap-2 bg-[#11241e] border 
      border-[#14532d] rounded-full py-1 px-3 shadow-lg">
        <span class="font-bold text-[9px] text-[#4ade80] uppercase tracking-wider">Online</span>
        <div class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#4ade80] 
          opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-[#4ade80]"></span>
        </div>
      </div>

      <div class="flex flex-col items-center">
        <div class="avatar placeholder mt-2">
          <div class="bg-neutral text-neutral-content rounded-full w-20 ring ring-[#a78bfa] 
          ring-offset-base-100 ring-offset-4">
            <span class="text-2xl font-syne font-bold text-white">R</span>
          </div>
        </div>
        <div class="text-center mt-5">
          <h2 class="text-lg font-syne font-bold tracking-tight">Ruhana Faiz</h2>
          <p class="text-[11px] opacity-60 mt-0.5">Frontend Developer • Yogyakarta</p>
          
          <div class="divider my-4 opacity-30"></div>

          <div class="flex justify-between items-center w-full gap-1">
            <div class="text-center">
              <div class="text-md font-syne font-bold">128</div>
              <div class="text-[8px] opacity-50 uppercase font-bold tracking-tight">Proyek</div>
            </div>
            <div class="text-center border-x border-white/5 px-3">
              <div class="text-md font-syne font-bold">4.9★</div>
              <div class="text-[8px] opacity-50 uppercase font-bold tracking-tight">Rating</div>
            </div>
            <div class="text-center">
              <div class="text-md font-syne font-bold">3th</div>
              <div class="text-[8px] opacity-50 uppercase font-bold tracking-tight">Exp</div>
            </div>
          </div>
        </div>
      </div>

      <div class="absolute bottom-6 left-6 right-6">
        <button class="btn btn-primary btn-sm btn-block bg-gradient-to-r from-[#a78bfa] 
        to-[#f472b6] border-none text-white font-bold hover:scale-[1.02] active:scale-95 
        transition-all duration-200">
          Lihat Profil Lengkap
        </button>
      </div>
    </div>

  </main>

  <button 
    onclick="window.scrollTo({top:0, behavior:'smooth'})"
    class="fixed bottom-8 right-8 z-[100] flex items-center justify-center w-14 h-14 rounded-full 
    bg-gradient-to-br from-[#a78bfa] to-[#f472b6] shadow-lg hover:scale-110 active:scale-95 
    transition-all group"
    title="Kembali ke Atas">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white group-hover:-translate-y-1 
    transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 10l7-7m0 0l7 7m-7-7v18" />
    </svg>
  </button>

</body>
</html>
